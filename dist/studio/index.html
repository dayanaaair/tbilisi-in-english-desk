function overview(){let done=data.filter(x=>x.status==='done').length;return heading('контент-студия','Первый трип → второй запуск','Вся стратегия, тексты, календарь и Stories в одном месте. Можно менять любые тексты, отмечать публикации и сохранять готовые изображения.')+`<div class="stats"><div class="stat"><span>Reels</span><strong>${data.filter(x=>x.type==='reel').length}</strong><span>сценариев + подписей</span></div><div class="stat"><span>Telegram</span><strong>${data.filter(x=>x.type==='post').length}</strong><span>готовых постов</span></div><div class="stat"><span>Stories</span><strong>${data.filter(x=>x.type==='story').reduce((a,x)=>a+x.frames.length,0)}</strong><span>экранов в ${data.filter(x=>x.type==='story').length} сериях</span></div><div class="stat"><span>Опубликовано</span><strong>${done}/${data.length}</strong><span>единиц контента</span></div></div><div class="cols"><div class="panel"><h2>Что делать сначала</h2><p>1. Открой раздел <b>Reels</b>, выбери первый сценарий и отредактируй под свои реальные кадры.</p><p>2. В <b>Telegram-постах</b> скопируй полноценный текст для канала.</p><p>3. В <b>Stories + дизайн</b> загрузи фотографию, поправь текст и сохрани готовый PNG 1080 × 1920.</p><p>4. Отмечай материалы как опубликованные в календаре.</p><div class="btnrow"><button class="btn primary" onclick="setPage('reel')">Открыть Reels →</button><button class="btn" onclick="setPage('story')">Сделать Stories</button></div></div><div class="panel"><h2>Твой стиль</h2><p>Я опиралась на публичные публикации о подготовке Тбилиси: конкретные детали, живые короткие реплики, дружелюбная самоирония и объяснение того, что стоит за решениями.</p><p>Вместо шаблонных рекламных финалов — естественное продолжение истории и ссылка на более подробный материал в Telegram.</p><div class="notice">Все Reels и все серии Stories содержат переход к <b>${esc(cfg.handle)}</b>. В Instagram ссылка обычно доступна через профиль или стикер Stories — просто текст @канала не создаёт активную ссылку в каждом Reel.</div></div></div><div class="panel"><h2>На что обратить внимание перед публикацией</h2><div class="tipgrid"><div class="tip"><b>Личные истории.</b><br>Согласуй с участницами конкретные эпизоды и эмоциональные подробности, не только фото.</div><div class="tip"><b>Бюджет.</b><br>60 000 ₽ — ориентир первого выезда. Проверь смету перед финансовыми публикациями.</div><div class="tip"><b>Отзывы.</b><br>Настоящие цитаты добавляй только после разбора записи; мы их не придумывали.</div></div></div>`}

function strategyView(){return heading('план продвижения','Почему это должно работать','Контент строится вокруг реального опыта, а не обещаний мгновенного результата.')+`<div class="panel"><h2>Главное сообщение</h2><p>Английский в поездке становится языком повседневных действий: от завтрака и настольных игр до разговорного клуба и экскурсий. Не «свободный английский за пять дней», а возможность использовать уже изученное в живой среде.</p></div><div class="cols"><div class="panel"><h3>Instagram → узнаваемость</h3><p>Истории с сюжетом, необычные бытовые ситуации, язык из реальной жизни, настоящие реплики участниц. Первая строка каждого Reel должна быть интересна человеку, который ещё не знает тебя.</p><p>Каждый Reel: короткий переход в профиль и Telegram. Подписи уже подготовлены.</p></div><div class="panel"><h3>Telegram → доверие</h3><p>Подробные дневники, наблюдения преподавателя, отзывы и разбор программы. Здесь аудитория понимает, что отличает поездку от обычного тура.</p><p>Начиная с декабря — предварительный список заинтересованных; только после подтверждения условий — бронирование.</p></div></div><div class="panel"><h2>План запуска</h2><div class="tipgrid"><div class="tip"><b>Ноябрь</b><br>Показать поездку и истории участниц. Не торопиться продавать.</div><div class="tip"><b>Декабрь</b><br>Спросить о сезоне, проверить интерес, собрать предварительные контакты.</div><div class="tip"><b>Январь–февраль</b><br>После расчётов — даты, условия, заявки и отбор по уровню.</div></div></div><div class="panel"><h2>Показатели для еженедельной проверки</h2><p>Reels: охват неподписчиков, среднее время просмотра, пересылки, переходы в профиль и новые подписки. Telegram: просмотры постов, реакции, переходы по ссылке и содержательные обращения. Для набора: сколько людей оставили интерес, сколько подходят по уровню, сколько готовы обсуждать конкретные условия.</p><p><b>Важно:</b> пять мест не требуют десятков тысяч просмотров. Но сначала нужно понять, насколько аудитории вообще интересен формат и какую стоимость она готова обсуждать.</p></div><div class="panel"><h2>Заметки по стилю</h2><p>Твои публичные тексты о поездке содержат конкретные цифры, имена, личные причины участниц и ироничную ремарку о том, что образ туроператора уже сформирован. Поэтому в материалах мы убрали почти все «маркетинговые» выводы и оставили речь, похожую на сообщения живого человека.</p><p class="helper">Осторожно с историей сложного первого дня: детали психологического состояния участницы согласовывать отдельно. Оценку уровня B1 лучше использовать как ориентир, а не гарантию комфортного участия для всех.</p></div>`}

function backup(){const blob=new Blob([JSON.stringify({version:3,exported:new Date().toISOString(),data,cfg},null,2)],{type:'application/json'});saveBlob(blob,'dayahenglish-backup.json')}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function restoreFile(file){if(!file)return;try{let o=JSON.parse(await file.text());if(!Array.isArray(o.data)||!o.data.every(x=>x.id&&x.type))throw Error('Неверный формат');if(!confirm('Заменить текущие тексты содержимым файла?'))return;data=o.data;cfg=o.cfg||cfg;persist();saveCfg();render();toast('Копия восстановлена')}catch(e){alert('Не получилось загрузить резервную копию: '+e.message)}}
function resetAll(){if(!confirm('Точно вернуть все тексты к исходным? Текущие правки будут потеряны.'))return;data=JSON.parse(JSON.stringify(INITIAL));persist();render();toast('Материалы сброшены')}

const dbReady=new Promise((resolve,reject)=>{let req=indexedDB.open('dayahenglish-story-photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function photoSet(key,dataurl){let db=await dbReady;return new Promise((resolve,reject)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(dataurl,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function photoGet(key){let db=await dbReady;return new Promise((resolve,reject)=>{let tx=db.transaction('photos','readonly');let req=tx.objectStore('photos').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}

function resetStoryConfig(){storyConfig={font:29,x:8,y:56,width:84,align:'left',shade:45,logo:true,color:'#ffffff',photo:null};loadStoryConfig()}
async function loadStoryConfig(){let key=storyKey();try{const a=JSON.parse(localStorage.getItem('story-style-'+key)||'null');if(a)Object.assign(storyConfig,a,{photo:null});const src=await photoGet(key);if(storyKey()===key){storyConfig.photo=src;renderStoryPreview()}}catch(e){renderStoryPreview()}}
function persistStoryConfig(){let {photo,...rest}=storyConfig;try{localStorage.setItem('story-style-'+storyKey(),JSON.stringify(rest))}catch(e){} }
function setFrame(i){frameIndex=i;resetStoryConfig();render()}
function storyEditor(x){const frame=x.frames[frameIndex]||x.frames[0];return `<div class="topbar"><div><div class="eyebrow">Stories · ${esc(x.date)}</div><h1>${esc(x.title)}</h1><p class="muted" style="margin:0">Каждый экран ведёт к Telegram: финальный содержит прямой призыв использовать стикер ссылки.</p></div><button class="btn" onclick="editingId=null;render()">← К списку</button></div><div class="frame-tabs">${x.frames.map((f,i)=>`<button class="btn small ${i===frameIndex?'active':''}" onclick="setFrame(${i})">Экран ${i+1}</button>`).join('')}</div><div class="story-layout"><div class="story-preview-wrap"><div class="story-stage" id="storyStage"><img id="storyImg" class="hide"><div class="story-shadow" id="storyShade"></div><div class="story-text" id="storyText"></div><div class="story-logo" id="storyLogo">${esc(cfg.handle)} · в Telegram →</div></div><div class="btnrow"><button class="btn primary" onclick="exportStory('download')">↓ Скачать PNG</button><button class="btn" onclick="exportStory('clipboard')">▢ Скопировать картинку</button></div><p class="helper" style="max-width:380px;text-align:center">Перетаскивай текст прямо на фотографии. PNG сохраняется в формате 1080 × 1920. Ссылку в Stories добавляй стикером Instagram уже после загрузки изображения.</p></div><div class="panel story-controls" style="margin:0"><h3>Редактор экрана ${frameIndex+1}</h3><label>Какой кадр подобрать</label><input class="field" value="${esc(frame.scene)}" oninput="updateStoryScene(this.value)"><label>Текст поверх фото</label><textarea class="field" id="storyCopy" oninput="updateStoryText(this.value)">${esc(frame.text)}</textarea><div class="btnrow"><button class="btn small" onclick="copy(item(storyId).frames[frameIndex].text)">Копировать текст</button><button class="btn small" onclick="copy(cfg.channel)">Копировать ссылку Telegram</button></div><label>Фото или фоновое изображение</label><input type="file" accept="image/*" class="field" onchange="uploadStoryPhoto(this.files[0])"><div class="btnrow"><button class="btn small" onclick="clearStoryPhoto()">Убрать фото</button></div><label>Размер текста: <span id="fontNumber">${storyConfig.font}</span></label><input id="fontRange" type="range" min="17" max="50" value="${storyConfig.font}" oninput="setStoryStyle('font',+this.value)"><label>Ширина текстового блока</label><input type="range" min="38" max="93" value="${storyConfig.width}" oninput="setStoryStyle('width',+this.value)"><label>Затемнение фото: <span id="shadeNumber">${storyConfig.shade}</span>%</label><input type="range" min="0" max="85" value="${storyConfig.shade}" oninput="setStoryStyle('shade',+this.value)"><label>Выравнивание текста</label><select class="field" onchange="setStoryStyle('align',this.value)"><option ${storyConfig.align==='left'?'selected':''} value="left">Слева</option><option ${storyConfig.align==='center'?'selected':''} value="center">По центру</option><option ${storyConfig.align==='right'?'selected':''} value="right">Справа</option></select><label>Цвет текста</label><input type="color" value="${storyConfig.color}" onchange="setStoryStyle('color',this.value)"><label><input class="check" type="checkbox" ${storyConfig.logo?'checked':''} onchange="setStoryStyle('logo',this.checked)"> Показывать подпись Telegram</label><div class="separator"></div><label>Статус серии</label>${statusSelect(x)}<p class="helper">Фотографии сохраняются локально в этом браузере. JSON-резервная копия включает тексты и настройки, но не сами фотографии.</p></div></div>`}
function updateStoryScene(v){item(storyId).frames[frameIndex].scene=v;persist()}
function updateStoryText(v){item(storyId).frames[frameIndex].text=v;persist();renderStoryPreview()}
function setStoryStyle(k,v){storyConfig[k]=v;persistStoryConfig();renderStoryPreview();const n=document.getElementById(k==='font'?'fontNumber':k==='shade'?'shadeNumber':'_none');if(n)n.textContent=v}
function renderStoryPreview(){let img=document.getElementById('storyImg'),t=document.getElementById('storyText'),sh=document.getElementById('storyShade'),logo=document.getElementById('storyLogo');if(!t)return;img.src=storyConfig.photo||'';img.classList.toggle('hide',!storyConfig.photo);t.textContent=item(storyId)?.frames[frameIndex]?.text||'';Object.assign(t.style,{left:storyConfig.x+'%',top:storyConfig.y+'%',width:storyConfig.width+'%',fontSize:storyConfig.font+'px',textAlign:storyConfig.align,color:storyConfig.color});sh.style.background=`linear-gradient(0deg,rgba(0,0,0,${storyConfig.shade/100}),rgba(0,0,0,${storyConfig.shade/250}) 90%)`;logo.style.display=storyConfig.logo?'block':'none'}
async function uploadStoryPhoto(file){if(!file)return;const reader=new FileReader();reader.onload=async()=>{try{storyConfig.photo=reader.result;await photoSet(storyKey(),storyConfig.photo);renderStoryPreview();toast('Фото добавлено')}catch(e){toast('Не получилось сохранить фото') }};reader.readAsDataURL(file)}
async function clearStoryPhoto(){storyConfig.photo=null;await photoSet(storyKey(),null);renderStoryPreview();toast('Фото убрано')}
function activateDrag(){const box=document.getElementById('storyText'),stage=document.getElementById('storyStage');if(!box||!stage)return;let dragging=false,offsetX=0,offsetY=0;box.addEventListener('pointerdown',e=>{dragging=true;box.classList.add('dragging');box.setPointerCapture(e.pointerId);let sr=stage.getBoundingClientRect(),br=box.getBoundingClientRect();offsetX=e.clientX-br.left;offsetY=e.clientY-br.top;e.preventDefault()});box.addEventListener('pointermove',e=>{if(!dragging)return;let sr=stage.getBoundingClientRect();storyConfig.x=Math.max(2,Math.min(98-storyConfig.width,(e.clientX-sr.left-offsetX)/sr.width*100));storyConfig.y=Math.max(6,Math.min(82,(e.clientY-sr.top-offsetY)/sr.height*100));renderStoryPreview()});const end=()=>{if(dragging){dragging=false;box.classList.remove('dragging');persistStoryConfig()}};box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end)}
const loadImage=src=>new Promise((ok,no)=>{let i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
function wrapParagraph(ctx,p,max){if(!p)return [''];let arr=[],line='';for(const word of p.split(/\s+/)){let trial=line?line+' '+word:word;if(ctx.measureText(trial).width>max&&line){arr.push(line);line=word}else{line=trial}if(ctx.measureText(line).width>max){let rest='';for(let j=0;j<line.length;j++){if(ctx.measureText(rest+line[j]).width>max&&rest){arr.push(rest);rest=''}rest+=line[j]}line=rest}}arr.push(line);return arr}
async function storyBlob(){const w=1080,h=1920,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');let grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#1a4037');grad.addColorStop(1,'#678074');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);if(storyConfig.photo){const img=await loadImage(storyConfig.photo);const scale=Math.max(w/img.width,h/img.height),sw=img.width*scale,sh=img.height*scale;ctx.drawImage(img,(w-sw)/2,(h-sh)/2,sw,sh)}let g=ctx.createLinearGradient(0,h,0,0);g.addColorStop(0,`rgba(0,0,0,${storyConfig.shade/100})`);g.addColorStop(1,`rgba(0,0,0,${storyConfig.shade/250})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const stage=document.getElementById('storyStage');let ratio=stage? w/stage.clientWidth:3;let fs=storyConfig.font*ratio;ctx.font=`750 ${fs}px Arial,sans-serif`;ctx.textBaseline='top';ctx.textAlign=storyConfig.align;ctx.fillStyle=storyConfig.color;ctx.shadowColor='rgba(0,0,0,.56)';ctx.shadowBlur=20;ctx.shadowOffsetY=5;let px=storyConfig.x/100*w,py=storyConfig.y/100*h,maxW=storyConfig.width/100*w;let tx=storyConfig.align==='center'?px+maxW/2:storyConfig.align==='right'?px+maxW:px;let lines=[];for(let p of (item(storyId).frames[frameIndex].text||'').split('\n'))lines.push(...wrapParagraph(ctx,p,maxW));const step=fs*1.2;for(let k=0;k<lines.length;k++){if(py+k*step>h*.9)break;ctx.fillText(lines[k],tx,py+k*step)}ctx.shadowBlur=0;ctx.shadowOffsetY=0;if(storyConfig.logo){const brand=cfg.handle+' · в Telegram →';ctx.font='500 29px Arial,sans-serif';let bw=ctx.measureText(brand).width+38;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.roundRect(72,h-165,bw,55,26);ctx.fill();ctx.fillStyle='white';ctx.textAlign='left';ctx.fillText(brand,91,h-153)}return new Promise(resolve=>c.toBlob(resolve,'image/png'))}
async function exportStory(mode){try{let b=await storyBlob();if(mode==='clipboard'){if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Картинка скопирована — вставь в редактор')}else{saveBlob(b,`story-${storyId}-${frameIndex+1}.png`);toast('Браузер не поддерживает копирование изображения — сохранён PNG')}}else{saveBlob(b,`story-${storyId}-${frameIndex+1}.png`);toast('Story сохранена как PNG')}}catch(e){console.error(e);toast('Не удалось создать изображение. Попробуй скачать PNG.')}}
function render(){navHTML();let main=document.getElementById('main');main.innerHTML=page==='overview'?overview():page==='calendar'?calendarView():page==='strategy'?strategyView():page==='settings'?settingsView():editingId?editingView():cardsView(page);if(editingId&&item(editingId)?.type==='story'){renderStoryPreview();activateDrag()}}
render();
</script></body></html>
